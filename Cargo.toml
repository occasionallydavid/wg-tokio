[package]
name = "wg-tokio"
version = "0.1.0"
edition = "2024"
description = "A small tokio::net-style TCP API over BoringTun and smoltcp"
license = "MIT OR Apache-2.0"

[features]
default = ["crypto-rust"]
crypto-ring = ["dep:boringtun"]
crypto-rust = ["dep:nordisk"]

[dependencies]
boringtun = { version = "0.7.1", default-features = false, optional = true }
nordisk = { package = "nordisk-boringtun", version = "0.7.2", default-features = false, optional = true }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "std",
] }
tokio = { version = "1.54.0", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { version = "1.54.0", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
] }


[profile.production]
inherits = "release"
codegen-units = 1
opt-level = "z"  # Optimize for size.
lto = "fat"
strip = true  # Automatically strip symbols from the binary.
