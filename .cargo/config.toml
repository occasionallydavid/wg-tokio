[build]
target = "x86_64-unknown-linux-gnu"

[unstable]
build-std = ["core", "alloc", "std", "panic_abort"]
build-std-features = ["optimize_for_size"]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-Zlocation-detail=none",
    "-Zunstable-options",
    "-Cpanic=immediate-abort",
    "-Cforce-unwind-tables=no",
    "-Zpanic_abort_tests",
]
